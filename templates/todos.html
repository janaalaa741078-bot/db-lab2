<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="light-mode" id="body">
    <div class="container">
        <header>
            <h1>To-Do List</h1>
            <div class="user-info">
                <span>Hi, {{ session.get('user_name', 'User') }}</span>
                <button id="dark-mode-toggle" onclick="toggleDarkMode()" class="toggle-btn">🌙 Dark Mode</button>
                <a href="{{ url_for('logout') }}" class="logout-btn">Log out</a>
            </div>
        </header>

        <form action="{{ url_for('add_todo') }}" method="POST" class="add-form">
            <input type="text" name="task" placeholder="What needs to be done?" required maxlength="200">
            <button type="submit">Add</button>
        </form>

        <div class="dashboard-controls">
            <p class="counter">You have <strong>{{ open_count }}</strong> pending task(s)</p>
            <div class="filters">
                <a href="{{ url_for('todos', filter='all') }}" class="filter-btn {% if current_filter == 'all' %}active{% endif %}">All</a>
                <a href="{{ url_for('todos', filter='open') }}" class="filter-btn {% if current_filter == 'open' %}active{% endif %}">Open</a>
                <a href="{{ url_for('todos', filter='done') }}" class="filter-btn {% if current_filter == 'done' %}active{% endif %}">Done</a>
            </div>
        </div>

        <ul class="todo-list">
            {% for todo in tasks %}
            <li class="todo-item {% if todo.completed %}completed{% endif %}">
                <form action="{{ url_for('toggle_todo', task_id=todo.id) }}" method="POST" style="display:inline;">
                    <button type="submit" class="status-btn">{% if todo.completed %}✓{% else %}○{% endif %}</button>
                </form>

                <form action="{{ url_for('edit_todo', task_id=todo.id) }}" method="POST" class="edit-form">
                    <input type="text" name="task" value="{{ todo.task }}" required maxlength="200">
                    <button type="submit" class="save-btn">Save</button>
                </form>

                <form action="{{ url_for('delete_todo', task_id=todo.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this task?');">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </li>
            {% else %}
            <p class="empty-state">No tasks found. Enjoy your free time!</p>
            {% endfor %}
        </ul>
    </div>

    <script>
        function toggleDarkMode() {
            const body = document.getElementById('body');
            const btn = document.getElementById('dark-mode-toggle');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                btn.textContent = '☀️ Light Mode';
            } else {
                btn.textContent = '🌙 Dark Mode';
            }
        }
    </script>
</body>
</html>
